services:
  - type: web
    name: proovixy-api
    runtime: python
    pythonVersion: "3.12.8"
    buildCommand: pip install -r service/requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --app-dir service
    healthCheckPath: /v1/health
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_CHAT_PATH
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        sync: false
      - key: LLM_MAX_TOKENS
        sync: false
      - key: LLM_TEMPERATURE
        sync: false
      - key: LLM_TEMPERATURE_EXPAND
        sync: false
      - key: SERVICE_TOKENS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DAILY_QUOTA
        sync: false
      - key: MAX_TEXT_CHARS
        sync: false
      - key: MAX_EXTRAS_CHARS
        sync: false
      - key: MAX_DEVICES_PER_TOKEN
        sync: false
      - key: TIMESTAMP_SKEW
        sync: false
      - key: NONCE_TTL_SECONDS
        sync: false
      - key: REQUIRE_HTTPS
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: MAX_REQUEST_BODY_BYTES
        sync: false
      - key: ADMIN_LOGIN_RATE_LIMIT
        sync: false
      - key: ADMIN_LOGIN_RATE_WINDOW_SECONDS
        sync: false
      - key: API_RATE_LIMIT
        sync: false
      - key: API_RATE_WINDOW_SECONDS
        sync: false
      - key: ADMIN_REDACT_SENSITIVE
        sync: false
      - key: DATA_PATH
        sync: false
      - key: ADMIN_COOKIE_MAX_AGE_SECONDS
        sync: false
      - key: ADMIN_EVENT_LOG_SIZE
        sync: false
      - key: ADMIN_LOG_DISPLAY_LIMIT
        sync: false
